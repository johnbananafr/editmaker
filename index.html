<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JOHN BANANA — AUTO EDIT MAKER</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=DM+Mono:wght@400;500;700&family=Inter:wght@500;600;700;800;900&display=swap');

:root{
  --purple:#ab04f9;
  --dark:#7800ad;
  --light:#d96cff;
  --cream:#f4efe5;
  --red:#ff304f;
  --yellow:#ffe600;
  --black:#080609;
  --green:#43e36f;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  background:var(--cream);
  color:var(--black);
  font-family:Inter,Arial,sans-serif;
}

.wrap{
  width:min(1120px,94vw);
  margin:auto;
  padding:28px 0 60px;
}

/* =========================================================
   HEADER
========================================================= */

header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:28px;
}

.logo{
  font-family:Bangers,cursive;
  font-size:clamp(48px,8vw,82px);
  line-height:.8;
  letter-spacing:2px;
  color:var(--purple);
  text-shadow:4px 4px 0 var(--black);
  transform:rotate(-2deg);
}

.logo span{
  color:var(--red);
}

.subtitle{
  font-family:"DM Mono",monospace;
  font-size:11px;
  line-height:1.5;
  text-align:right;
  font-weight:700;
}

/* =========================================================
   MAIN
========================================================= */

.layout{
  display:grid;
  grid-template-columns:350px minmax(0,1fr);
  gap:28px;
  align-items:start;
}

.panel{
  background:#fff;
  border:3px solid var(--black);
  border-radius:18px;
  box-shadow:8px 8px 0 var(--black);
  padding:20px;
}

.panel h2{
  margin:0 0 15px;
  font-family:Bangers,cursive;
  font-size:29px;
  letter-spacing:1px;
}

/* =========================================================
   IMPORT BUTTONS
========================================================= */

.imports{
  display:grid;
  gap:10px;
}

.importBtn{
  width:100%;
  border:3px solid var(--black);
  border-radius:12px;
  padding:14px;
  background:#fff;
  color:var(--black);
  text-align:left;
  font-family:Inter,sans-serif;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  transition:transform .1s,box-shadow .1s;
}

.importBtn:hover{
  transform:translate(-2px,-2px);
  box-shadow:4px 4px 0 var(--black);
}

.importBtn.video{
  background:#ead5ff;
}

.importBtn.audio{
  background:#fff1a3;
}

input[type=file]{
  display:none;
}

/* =========================================================
   STATUS
========================================================= */

.status{
  display:grid;
  gap:7px;
  margin-top:15px;
}

.statusRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:9px 11px;
  border-radius:8px;
  background:#f0ede7;
  font-family:"DM Mono",monospace;
  font-size:11px;
  font-weight:700;
}

.statusRow strong{
  color:var(--purple);
}

/* =========================================================
   CONTROLS
========================================================= */

.control{
  margin-top:21px;
}

.control label{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  font-family:"DM Mono",monospace;
  font-size:11px;
  font-weight:700;
}

input[type=range]{
  width:100%;
  accent-color:var(--purple);
}

.buttons{
  display:grid;
  gap:10px;
  margin-top:20px;
}

button.action{
  border:3px solid var(--black);
  border-radius:12px;
  padding:14px 16px;
  font-family:Inter,sans-serif;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
}

button.primary{
  background:var(--purple);
  color:white;
}

button.export{
  background:var(--yellow);
  color:var(--black);
}

button.action:disabled{
  opacity:.42;
  cursor:not-allowed;
}

.message{
  margin-top:15px;
  min-height:48px;
  padding:11px;
  border:2px dashed var(--black);
  border-radius:10px;
  font-family:"DM Mono",monospace;
  font-size:10px;
  line-height:1.5;
}

/* =========================================================
   PREVIEW
========================================================= */

.previewPanel{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.previewWrap{
  position:relative;
  width:min(100%,540px);
  aspect-ratio:9 / 16;
  background:#080609;
  border:4px solid var(--black);
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  user-select:none;
  touch-action:manipulation;
}

#canvas{
  display:block;
  width:100%;
  height:100%;
}

.pauseOverlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .12s ease;
}

.pauseOverlay.show{
  opacity:1;
}

.pauseIcon{
  width:76px;
  height:76px;
  border-radius:50%;
  background:rgba(0,0,0,.68);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;
  font-weight:900;
}

.previewHint{
  margin-top:10px;
  font-family:"DM Mono",monospace;
  font-size:10px;
  font-weight:700;
  text-align:center;
}

.progressOuter{
  width:min(100%,540px);
  height:10px;
  margin-top:13px;
  background:#ddd;
  border:2px solid var(--black);
  border-radius:99px;
  overflow:hidden;
}

.progressInner{
  width:0%;
  height:100%;
  background:var(--purple);
}

.timelineInfo{
  width:min(100%,540px);
  display:flex;
  justify-content:space-between;
  margin-top:7px;
  font-family:"DM Mono",monospace;
  font-size:10px;
  font-weight:700;
}

@media(max-width:820px){

  .layout{
    grid-template-columns:1fr;
  }

  .previewPanel{
    order:-1;
  }

  header{
    flex-direction:column;
    align-items:flex-start;
  }

  .subtitle{
    text-align:left;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header>

  <div class="logo">
    AUTO <span>EDIT</span>
  </div>

  <div class="subtitle">
    JOHN BANANA'S COMPLETELY AUTOMATIC<br>
    BEAT-SYNCED EDIT MACHINE™
  </div>

</header>


<div class="layout">

  <!-- =====================================================
       LEFT PANEL
  ====================================================== -->

  <section class="panel">

    <h2>IMPORT STUFF</h2>

    <div class="imports">

      <button
        class="importBtn"
        id="photoButton"
      >
        📸 ADD PHOTOS
      </button>

      <button
        class="importBtn video"
        id="videoButton"
      >
        🎬 ADD VIDEOS
      </button>

      <button
        class="importBtn audio"
        id="audioButton"
      >
        🔊 ADD MUSIC
      </button>

    </div>


    <input
      id="photoInput"
      type="file"
      accept="image/*"

    >

    <input
      id="videoInput"

      accept="video/*,.mp4,.mov,.webm,.m4v"
      multiple
    >

    <input
      id="audioInput"
      type="file"
      accept="audio/*,.mp3,.m4a,.wav,.aac,.caf,.ogg,.opus"
    >


    <div class="status">

      <div class="statusRow">
        <span>PHOTOS</span>
        <strong id="photoCount">0</strong>
      </div>

      <div class="statusRow">
        <span>VIDEOS</span>
        <strong id="videoCount">0</strong>
      </div>

      <div class="statusRow">
        <span>MUSIC</span>
        <strong id="audioStatus">NONE</strong>
      </div>

      <div class="statusRow">
        <span>BEATS</span>
        <strong id="beatCount">0</strong>
      </div>

    </div>


    <div class="control">

      <label>
        <span>BEAT SENSITIVITY</span>
        <span id="sensitivityValue">50</span>
      </label>

      <input
        id="sensitivity"
        type="range"
        min="0"
        max="100"
        value="50"
      >

    </div>


    <div class="buttons">

      <button
        class="action primary"
        id="generateButton"
        disabled
      >
        ⚡ GENERATE EDIT
      </button>

      <button
        class="action export"
        id="exportButton"
        disabled
      >
        💾 EXPORT WEBM
      </button>

    </div>


    <div
      class="message"
      id="message"
    >
      Add some photos, videos and music.
    </div>

  </section>


  <!-- =====================================================
       PREVIEW
  ====================================================== -->

  <section class="panel previewPanel">

    <div
      class="previewWrap"
      id="previewWrap"
      title="Tap / click to pause or play"
    >

      <canvas
        id="canvas"
        width="540"
        height="960"
      ></canvas>

      <div
        class="pauseOverlay"
        id="pauseOverlay"
      >
        <div
          class="pauseIcon"
          id="pauseIcon"
        >Ⅱ</div>
      </div>

    </div>


    <div class="previewHint">
      TAP / CLICK THE PREVIEW TO PAUSE OR PLAY
    </div>


    <div class="progressOuter">
      <div
        class="progressInner"
        id="progress"
      ></div>
    </div>


    <div class="timelineInfo">

      <span id="timeLabel">00:00</span>

      <span id="clipLabel">READY</span>

      <span id="durationLabel">00:00</span>

    </div>

  </section>

</div>

</div>


<script>

/* =========================================================
   DOM
========================================================= */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const previewWrap =
  document.getElementById("previewWrap");

const pauseOverlay =
  document.getElementById("pauseOverlay");

const pauseIcon =
  document.getElementById("pauseIcon");

const photoInput =
  document.getElementById("photoInput");

const videoInput =
  document.getElementById("videoInput");

const audioInput =
  document.getElementById("audioInput");

const photoButton =
  document.getElementById("photoButton");

const videoButton =
  document.getElementById("videoButton");

const audioButton =
  document.getElementById("audioButton");

const generateButton =
  document.getElementById("generateButton");

const exportButton =
  document.getElementById("exportButton");

const photoCount =
  document.getElementById("photoCount");

const videoCount =
  document.getElementById("videoCount");

const audioStatus =
  document.getElementById("audioStatus");

const beatCount =
  document.getElementById("beatCount");

const sensitivity =
  document.getElementById("sensitivity");

const sensitivityValue =
  document.getElementById("sensitivityValue");

const message =
  document.getElementById("message");

const progress =
  document.getElementById("progress");

const timeLabel =
  document.getElementById("timeLabel");

const clipLabel =
  document.getElementById("clipLabel");

const durationLabel =
  document.getElementById("durationLabel");


/* =========================================================
   STATE
========================================================= */

let photos = [];
let videos = [];

let audioFile = null;
let audio = null;
let audioURL = null;

let audioContext = null;
let audioSource = null;
let audioDestination = null;

let audioGraphConnected = false;

let beats = [];
let sequence = [];

let totalDuration = 0;
let currentTime = 0;

let generated = false;
let generating = false;
let exporting = false;

let playing = false;
let paused = false;

let animationFrame = null;

let currentClipIndex = -1;

let activeVideo = null;
let activeVideoIndex = -1;

let videoStartTimeline = 0;

let videoStartToken = 0;


/* =========================================================
   BASIC HELPERS
========================================================= */

function clamp(value,min,max){
  return Math.max(min,Math.min(max,value));
}

function formatTime(seconds){

  seconds =
    Math.max(0,Number(seconds)||0);

  const mins =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60);

  return (
    String(mins).padStart(2,"0") +
    ":" +
    String(secs).padStart(2,"0")
  );
}

function setMessage(text){
  message.textContent = text;
}


/* =========================================================
   IMPORT
========================================================= */

photoButton.onclick = ()=>{
  photoInput.click();
};

videoButton.onclick = ()=>{
  videoInput.click();
};

audioButton.onclick = ()=>{
  audioInput.click();
};


/* ---------------- PHOTOS ---------------- */

photoInput.addEventListener(
  "change",
  async e=>{

    const files =
      [...e.target.files];

    for(const file of files){

      const url =
        URL.createObjectURL(file);

      const img =
        new Image();

      img.src = url;

      await new Promise(resolve=>{

        img.onload = resolve;
        img.onerror = resolve;

      });

      photos.push({
        file,
        url,
        img
      });
    }

    photoInput.value = "";

    photoCount.textContent =
      photos.length;

    updateButtons();

    drawPlaceholder();

    setMessage(
      `${photos.length} photo${
        photos.length === 1 ? "" : "s"
      } loaded.`
    );
  }
);


/* ---------------- VIDEOS ---------------- */

videoInput.addEventListener(
  "change",
  async e=>{

    const files =
      [...e.target.files];

    for(const file of files){

      const url =
        URL.createObjectURL(file);

      const video =
        document.createElement("video");

      video.preload = "auto";
      video.playsInline = true;
      video.muted = true;
      video.loop = false;
      video.controls = false;

      video.src = url;

      await waitForVideo(video);

      videos.push({

        file,
        url,
        video,

        duration:
          Number.isFinite(video.duration)
            ? video.duration
            : 0

      });
    }

    videoInput.value = "";

    videoCount.textContent =
      videos.length;

    updateButtons();

    drawPlaceholder();

    setMessage(
      `${videos.length} video${
        videos.length === 1 ? "" : "s"
      } loaded. Videos will play first.`
    );
  }
);


/* ---------------- AUDIO ---------------- */

audioInput.addEventListener(
  "change",
  async e=>{

    const file =
      e.target.files[0];

    if(!file) return;

    if(audioURL){
      URL.revokeObjectURL(audioURL);
    }

    audioFile = file;

    audioURL =
      URL.createObjectURL(file);

    audio =
      new Audio();

    audio.src =
      audioURL;

    audio.preload =
      "auto";

    await new Promise(resolve=>{

      if(audio.readyState >= 1){
        resolve();
        return;
      }

      audio.addEventListener(
        "loadedmetadata",
        resolve,
        {once:true}
      );

    });

    audioStatus.textContent =
      formatTime(audio.duration);

    audioInput.value = "";

    updateButtons();

    setMessage(
      "Music loaded. Ready to detect the beat."
    );
  }
);


function waitForVideo(video){

  return new Promise(resolve=>{

    if(
      video.readyState >= 2 &&
      video.videoWidth
    ){

      resolve();
      return;
    }

    const done = ()=>{
      cleanup();
      resolve();
    };

    const cleanup = ()=>{

      video.removeEventListener(
        "loadeddata",
        done
      );

      video.removeEventListener(
        "canplay",
        done
      );

      video.removeEventListener(
        "error",
        done
      );
    };

    video.addEventListener(
      "loadeddata",
      done
    );

    video.addEventListener(
      "canplay",
      done
    );

    video.addEventListener(
      "error",
      done
    );

  });
}


/* =========================================================
   BUTTONS
========================================================= */

function updateButtons(){

  const hasMedia =
    photos.length ||
    videos.length;

  generateButton.disabled =
    !audio ||
    !hasMedia ||
    generating ||
    exporting;

  exportButton.disabled =
    !generated ||
    generating ||
    exporting;
}


/* =========================================================
   DRAW — 9:16 COVER
========================================================= */

/*
  THIS is the important video placement fix.

  Whatever aspect ratio the source is:

      16:9
      4:3
      1:1
      21:9

  it gets scaled until the ENTIRE 540x960 canvas
  is covered.

  No letterboxing.
  No tiny video sitting in the middle.
  No distorted stretching.
*/

function drawCover(source){

  const sw =
    source.videoWidth ||
    source.naturalWidth ||
    source.width;

  const sh =
    source.videoHeight ||
    source.naturalHeight ||
    source.height;

  if(!sw || !sh){
    ctx.fillStyle = "#080609";
    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );
    return;
  }

  const scale =
    Math.max(
      canvas.width / sw,
      canvas.height / sh
    );

  const dw =
    sw * scale;

  const dh =
    sh * scale;

  const dx =
    (canvas.width - dw) / 2;

  const dy =
    (canvas.height - dh) / 2;

  ctx.drawImage(
    source,
    dx,
    dy,
    dw,
    dh
  );
}


function drawPlaceholder(){

  ctx.fillStyle =
    "#080609";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.fillStyle =
    "#fff";

  ctx.font =
    "900 38px Inter";

  ctx.fillText(
    "JOHN BANANA",
    canvas.width / 2,
    canvas.height / 2 - 24
  );

  ctx.font =
    "700 15px 'DM Mono'";

  ctx.fillText(
    "AUTO EDIT MAKER",
    canvas.width / 2,
    canvas.height / 2 + 25
  );
}


/* =========================================================
   PHOTO PHYSICS
========================================================= */

/*
  The photo physics are intentionally separate from
  video physics.

  Beat = stronger impact.
  No random video syncing.
*/

function randomFromSeed(seed){

  const x =
    Math.sin(seed * 12.9898) *
    43758.5453;

  return x -
    Math.floor(x);
}


function applyPhotoPhysics(
  localTime,
  strength,
  clipIndex
){

  strength =
    clamp(strength,0,1);

  /*
    Decaying impact.
  */

  const impact =
    Math.pow(strength,.82);

  /*
    Smooth deterministic shake.
  */

  const seed =
    clipIndex * 71.31;

  const xNoise =
    Math.sin(
      localTime * 70 +
      seed
    );

  const yNoise =
    Math.cos(
      localTime * 63 +
      seed * 1.7
    );

  const rotNoise =
    Math.sin(
      localTime * 55 +
      seed * .8
    );

  const shake =
    impact * 18;

  const x =
    xNoise * shake;

  const y =
    yNoise * shake;

  const rotation =
    rotNoise *
    impact *
    .045;

  const zoom =
    1 +
    impact * .055;

  ctx.translate(
    canvas.width / 2 + x,
    canvas.height / 2 + y
  );

  ctx.rotate(rotation);

  ctx.scale(
    zoom,
    zoom
  );
}


/* =========================================================
   VIDEO PHYSICS
========================================================= */

function applyVideoPhysics(
  localTime,
  strength
){

  strength =
    clamp(strength,0,1);

  /*
    VERY subtle video movement.

    We don't use this to control video timing.
  */

  const x =
    Math.sin(localTime * 38) *
    strength *
    3;

  const y =
    Math.cos(localTime * 34) *
    strength *
    2;

  const rotation =
    Math.sin(localTime * 28) *
    strength *
    .007;

  const zoom =
    1 +
    strength * .015;

  ctx.translate(
    canvas.width / 2 + x,
    canvas.height / 2 + y
  );

  ctx.rotate(rotation);

  ctx.scale(
    zoom,
    zoom
  );
}


/* =========================================================
   BEAT DETECTION
========================================================= */

async function detectBeats(){

  if(!audioFile){
    beats = [];
    return;
  }

  setMessage(
    "Listening to the music... 👂"
  );

  const buffer =
    await audioFile.arrayBuffer();

  const AC =
    window.AudioContext ||
    window.webkitAudioContext;

  const temp =
    new AC();

  const decoded =
    await temp.decodeAudioData(
      buffer.slice(0)
    );

  await temp.close();

  const sr =
    decoded.sampleRate;

  const length =
    decoded.length;

  const channels =
    decoded.numberOfChannels;

  const mono =
    new Float32Array(length);

  for(
    let c=0;
    c<channels;
    c++
  ){

    const data =
      decoded.getChannelData(c);

    for(
      let i=0;
      i<length;
      i++
    ){

      mono[i] +=
        data[i] / channels;
    }
  }

  const windowSize =
    Math.max(
      256,
      Math.floor(sr * .025)
    );

  const hop =
    Math.floor(windowSize * .5);

  const energy = [];

  for(
    let i=0;
    i + windowSize < length;
    i += hop
  ){

    let sum = 0;

    for(
      let j=0;
      j<windowSize;
      j++
    ){

      const s =
        mono[i+j];

      sum +=
        s*s;
    }

    energy.push({

      time:i / sr,

      value:
        Math.sqrt(
          sum / windowSize
        )

    });
  }

  const smooth = [];

  for(
    let i=0;
    i<energy.length;
    i++
  ){

    let sum = 0;
    let count = 0;

    for(
      let j=Math.max(0,i-3);
      j<=Math.min(
        energy.length-1,
        i+3
      );
      j++
    ){

      sum +=
        energy[j].value;

      count++;
    }

    smooth.push({

      time:
        energy[i].time,

      value:
        sum / count

    });
  }

  const sens =
    Number(sensitivity.value) / 100;

  const minGap =
    .175 -
    sens * .03;

  const recent = [];
  const detected = [];

  let last =
    -Infinity;

  for(
    let i=2;
    i<smooth.length-2;
    i++
  ){

    const value =
      smooth[i].value;

    if(
      value <= smooth[i-1].value
    ) continue;

    if(
      value < smooth[i+1].value
    ) continue;

    recent.push(value);

    if(recent.length > 40){
      recent.shift();
    }

    const avg =
      recent.reduce(
        (a,b)=>a+b,
        0
      ) /
      recent.length;

    const variance =
      recent.reduce(
        (a,b)=>
          a +
          Math.pow(
            b-avg,
            2
          ),
        0
      ) /
      recent.length;

    const deviation =
      Math.sqrt(variance);

    const threshold =
      avg +
      deviation *
      (1.7 - sens*.65);

    if(value < threshold){
      continue;
    }

    const time =
      smooth[i].time;

    if(
      time-last < minGap
    ){
      continue;
    }

    const strength =
      clamp(
        (value-avg) /
        Math.max(
          deviation*2.5,
          .00001
        ),
        0,
        1
      );

    detected.push({
      time,
      strength
    });

    last =
      time;

    if(detected.length >= 900){
      break;
    }
  }

  if(detected.length < 4){

    beats = [];

    const interval =
      60 / 150;

    for(
      let t=0;
      t<decoded.duration;
      t+=interval
    ){

      beats.push({
        time:t,
        strength:.6
      });
    }

  }else{

    beats =
      detected;
  }

  beatCount.textContent =
    beats.length;

  setMessage(
    `${beats.length} beats detected.`
  );
}


/* =========================================================
   BUILD TIMELINE
========================================================= */

function buildSequence(){

  sequence = [];

  let timeline = 0;

  /*
    ========================================================
    PART 1 — ALL VIDEOS
    ========================================================

    Videos are ALWAYS first.

    The order is exactly the order the user selected.
  */

  for(
    let i=0;
    i<videos.length;
    i++
  ){

    const item =
      videos[i];

    const duration =
      Number(item.video.duration);

    if(
      !Number.isFinite(duration) ||
      duration <= 0
    ){
      continue;
    }

    sequence.push({

      type:"video",

      source:item.video,

      sourceIndex:i,

      start:timeline,

      end:
        timeline +
        duration

    });

    timeline +=
      duration;
  }

  /*
    ========================================================
    PART 2 — PHOTOS
    ========================================================

    THE EXACT START:
      final video end

    Not:
      next beat
      next animation frame
      next arbitrary time

    The first photo begins at precisely `timeline`.
  */

  const photoStart =
    timeline;

  const musicDuration =
    audio &&
    Number.isFinite(audio.duration)
      ? audio.duration
      : timeline;

  if(
    photos.length &&
    photoStart < musicDuration
  ){

    const remaining =
      musicDuration -
      photoStart;

    /*
      Beats occurring after the videos.
    */

    const afterVideoBeats =
      beats.filter(
        b =>
          b.time > photoStart &&
          b.time < musicDuration
      );

    /*
      First photo begins EXACTLY when
      the final video ends.
    */

    if(afterVideoBeats.length){

      let photoIndex = 0;

      let start =
        photoStart;

      for(
        let i=0;
        i<afterVideoBeats.length;
        i++
      ){

        const end =
          afterVideoBeats[i].time;

        if(end <= start){
          continue;
        }

        sequence.push({

          type:"photo",

          source:
            photos[
              photoIndex %
              photos.length
            ].img,

          sourceIndex:
            photoIndex %
            photos.length,

          start,

          end

        });

        photoIndex++;

        start =
          end;
      }

      /*
        Final photo fills to music end.
      */

      if(start < musicDuration){

        sequence.push({

          type:"photo",

          source:
            photos[
              photoIndex %
              photos.length
            ].img,

          sourceIndex:
            photoIndex %
            photos.length,

          start,

          end:
            musicDuration

        });
      }

    }else{

      /*
        No beats after videos.

        Divide remaining music between photos.
      */

      const durationPerPhoto =
        remaining /
        photos.length;

      for(
        let i=0;
        i<photos.length;
        i++
      ){

        const start =
          photoStart +
          i *
          durationPerPhoto;

        const end =
          i === photos.length-1
            ? musicDuration
            : start +
              durationPerPhoto;

        if(end <= start){
          continue;
        }

        sequence.push({

          type:"photo",

          source:
            photos[i].img,

          sourceIndex:i,

          start,

          end

        });
      }
    }
  }

  /*
    Total timeline.

    If there are videos longer than music,
    we still preserve the complete videos.
  */

  totalDuration =
    Math.max(
      musicDuration,
      timeline
    );

  durationLabel.textContent =
    formatTime(totalDuration);
}


/* =========================================================
   FIND CLIP
========================================================= */

function findClip(time){

  /*
    IMPORTANT:

    `time === clip.end` belongs to the NEXT clip.

    That means:

      video ends at 4.237
      photo begins at 4.237

    There is no extra video frame section.
  */

  for(
    let i=0;
    i<sequence.length;
    i++
  ){

    const clip =
      sequence[i];

    if(
      time >= clip.start &&
      time < clip.end
    ){

      return {
        clip,
        index:i
      };
    }
  }

  /*
    Don't return the final video beyond its end.

    This prevents the final video frame lingering.
  */

  return null;
}


/* =========================================================
   BEAT STRENGTH
========================================================= */

function getBeatStrength(time){

  if(!beats.length){
    return 0;
  }

  for(
    let i=beats.length-1;
    i>=0;
    i--
  ){

    const beat =
      beats[i];

    const delta =
      time -
      beat.time;

    if(delta < 0){
      continue;
    }

    if(delta > .16){
      break;
    }

    return clamp(
      beat.strength *
      (1 - delta/.16),
      0,
      1
    );
  }

  return 0;
}


/* =========================================================
   VIDEO CONTROL
========================================================= */

function stopAllVideos(){

  for(
    const item of videos
  ){

    try{
      item.video.pause();
    }catch(e){}

  }

  activeVideo = null;
  activeVideoIndex = -1;
  videoStartTimeline = 0;
}


/*
  Start exactly ONE video.

  The token prevents an older async start from
  taking control after a transition.
*/

async function startVideo(
  video,
  index,
  timelineTime
){

  const token =
    ++videoStartToken;

  stopAllVideos();

  activeVideo =
    video;

  activeVideoIndex =
    index;

  videoStartTimeline =
    timelineTime;

  video.loop =
    false;

  /*
    EXACTLY once:
    every new video starts at 0.
  */

  try{
    video.currentTime = 0;
  }catch(e){}

  await waitForVideoReady(video);

  /*
    Another video may have become active
    while this one was loading.
  */

  if(
    token !== videoStartToken ||
    activeVideo !== video ||
    !playing ||
    paused
  ){

    return;
  }

  try{
    await video.play();
  }catch(e){

    /*
      Browser autoplay restrictions are harmless
      because the preview is user initiated.
    */
  }
}


/*
  Resume the active video without restarting it.
*/

function resumeActiveVideo(){

  if(
    !activeVideo ||
    paused ||
    !playing
  ){
    return;
  }

  if(
    activeVideo.ended
  ){
    return;
  }

  activeVideo
    .play()
    .catch(()=>{});
}


/* =========================================================
   RENDER
========================================================= */

function renderFrame(time){

  const found =
    findClip(time);

  /*
    At exact end there is no lingering final video.
  */

  if(!found){

    /*
      If we've just passed the final clip,
      keep the last useful frame only for
      an extremely tiny visual endpoint.
    */

    if(sequence.length){

      const last =
        sequence[sequence.length-1];

      if(
        last.type === "photo" &&
        last.source
      ){

        ctx.save();

        ctx.translate(
          canvas.width/2,
          canvas.height/2
        );

        drawCover(last.source);

        ctx.restore();

        return;
      }
    }

    drawPlaceholder();

    return;
  }

  const clip =
    found.clip;

  const index =
    found.index;

  const localTime =
    Math.max(
      0,
      time - clip.start
    );

  const beatStrength =
    getBeatStrength(time);

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  /*
    ========================================================
    VIDEO
    ========================================================
  */

  if(clip.type === "video"){

    const video =
      clip.source;

    ctx.save();

    applyVideoPhysics(
      localTime,
      beatStrength
    );

    /*
      drawCover guarantees full-screen 9:16.
    */

    drawCover(video);

    ctx.restore();

  }

  /*
    ========================================================
    PHOTO
    ========================================================
  */

  else{

    const img =
      clip.source;

    ctx.save();

    applyPhotoPhysics(
      localTime,
      beatStrength,
      index
    );

    drawCover(img);

    ctx.restore();
  }

  /*
    Beat flash.
  */

  if(
    beatStrength > .72
  ){

    const alpha =
      (beatStrength-.72) * .25;

    ctx.fillStyle =
      `rgba(255,255,255,${alpha})`;

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );
  }

  if(
    clip.type === "video"
  ){

    clipLabel.textContent =
      `VIDEO ${
        clip.sourceIndex+1
      } / ${
        videos.length
      }`;

  }else{

    clipLabel.textContent =
      `PHOTO ${
        clip.sourceIndex+1
      } / ${
        photos.length
      }`;
  }
}


/* =========================================================
   CLIP TRANSITION
========================================================= */

function enterClip(
  found,
  time
){

  if(!found){
    return;
  }

  if(
    found.index ===
    currentClipIndex
  ){

    return;
  }

  currentClipIndex =
    found.index;

  const clip =
    found.clip;

  /*
    VIDEO → VIDEO

    Old video is killed.
    New video starts at exactly 0.
  */

  if(
    clip.type === "video"
  ){

    startVideo(
      clip.source,
      clip.sourceIndex,
      time
    );

  }else{

    /*
      VIDEO → PHOTO

      THIS IS THE HARD HANDOFF.

      The moment the timeline enters the photo:
      all videos are paused and removed.
    */

    stopAllVideos();
  }
}


/* =========================================================
   MASTER PLAYBACK LOOP
========================================================= */

function playbackLoop(){

  if(!playing){
    return;
  }

  if(paused){

    animationFrame =
      requestAnimationFrame(
        playbackLoop
      );

    return;
  }

  let time =
    audio
      ? audio.currentTime
      : currentTime;

  /*
    If audio is shorter than the video sequence,
    continue using elapsed wall time after audio ends.

    This keeps every video complete.
  */

  if(
    audio &&
    audio.ended &&
    totalDuration > audio.duration
  ){

    /*
      The audio has ended, but the video timeline
      still has time remaining.

      Calculate from the actual audio duration
      rather than restarting the clock.
    */

    time =
      Math.max(
        currentTime,
        audio.duration
      );

    time +=
      1 / 60;
  }

  currentTime =
    time;

  /*
    Finish.
  */

  if(
    currentTime >= totalDuration
  ){

    currentTime =
      totalDuration;

    playing = false;
    paused = false;

    if(audio){
      audio.pause();
    }

    stopAllVideos();

    progress.style.width =
      "100%";

    timeLabel.textContent =
      formatTime(totalDuration);

    pauseIcon.textContent =
      "▶";

    pauseOverlay.classList.add(
      "show"
    );

    return;
  }

  const found =
    findClip(currentTime);

  if(found){

    enterClip(
      found,
      currentTime
    );

  }

  renderFrame(
    currentTime
  );

  progress.style.width =
    clamp(
      currentTime /
      Math.max(totalDuration,.001) *
      100,
      0,
      100
    ) + "%";

  timeLabel.textContent =
    formatTime(currentTime);

  animationFrame =
    requestAnimationFrame(
      playbackLoop
    );
}


/* =========================================================
   START
========================================================= */

async function startPlayback(){

  if(
    !generated ||
    !audio
  ){
    return;
  }

  /*
    If we're at the end, restart.
  */

  if(
    currentTime >=
    totalDuration
  ){

    currentTime = 0;

    currentClipIndex = -1;

    if(audio){
      audio.currentTime = 0;
    }
  }

  /*
    Create audio graph once.
  */

  if(!audioContext){

    const AC =
      window.AudioContext ||
      window.webkitAudioContext;

    audioContext =
      new AC();
  }

  if(
    audioContext.state ===
    "suspended"
  ){

    await audioContext.resume();
  }

  if(!audioGraphConnected){

    audioSource =
      audioContext.createMediaElementSource(
        audio
      );

    audioDestination =
      audioContext.createMediaStreamDestination();

    audioSource.connect(
      audioContext.destination
    );

    audioSource.connect(
      audioDestination
    );

    audioGraphConnected =
      true;
  }

  playing = true;
  paused = false;

  pauseOverlay.classList.remove(
    "show"
  );

  pauseIcon.textContent =
    "Ⅱ";

  await audio.play();

  cancelAnimationFrame(
    animationFrame
  );

  animationFrame =
    requestAnimationFrame(
      playbackLoop
    );
}


/* =========================================================
   PAUSE / PLAY
========================================================= */

async function togglePlayback(){

  if(
    !generated ||
    generating ||
    exporting
  ){
    return;
  }

  /*
    Not playing → play.
  */

  if(!playing){

    await startPlayback();

    return;
  }

  /*
    PLAYING → PAUSED
  */

  if(!paused){

    paused = true;

    if(audio){
      audio.pause();
    }

    for(
      const item of videos
    ){

      try{
        item.video.pause();
      }catch(e){}
    }

    pauseIcon.textContent =
      "▶";

    pauseOverlay.classList.add(
      "show"
    );

    return;
  }

  /*
    PAUSED → PLAYING
  */

  paused = false;

  if(
    audioContext &&
    audioContext.state === "suspended"
  ){

    await audioContext.resume();
  }

  if(audio){
    await audio.play();
  }

  resumeActiveVideo();

  pauseIcon.textContent =
    "Ⅱ";

  pauseOverlay.classList.remove(
    "show"
  );
}


/*
  RESTORED:

  Tap/click preview = pause/play.
*/

previewWrap.addEventListener(
  "click",
  togglePlayback
);


/* =========================================================
   GENERATE
========================================================= */

generateButton.addEventListener(
  "click",
  async ()=>{

    if(generating){
      return;
    }

    generating = true;

    updateButtons();

    playing = false;
    paused = false;

    cancelAnimationFrame(
      animationFrame
    );

    stopAllVideos();

    try{

      if(!audio){
        throw new Error(
          "Add music first."
        );
      }

      await detectBeats();

      buildSequence();

      if(!sequence.length){

        throw new Error(
          "No usable clips were found."
        );
      }

      generated = true;

      currentTime = 0;

      currentClipIndex = -1;

      stopAllVideos();

      renderFrame(0);

      progress.style.width =
        "0%";

      timeLabel.textContent =
        "00:00";

      setMessage(
        "EDIT GENERATED. Tap the preview to play/pause. 🔥"
      );

    }catch(error){

      console.error(error);

      generated = false;

      setMessage(
        "Generation failed: " +
        error.message
      );

    }finally{

      generating = false;

      updateButtons();
    }
  }
);


/* =========================================================
   EXPORT
========================================================= */

exportButton.addEventListener(
  "click",
  async ()=>{

    if(
      exporting ||
      !generated ||
      !audio
    ){
      return;
    }

    exporting = true;

    updateButtons();

    setMessage(
      "Exporting WebM... 🎬"
    );

    playing = false;
    paused = false;

    cancelAnimationFrame(
      animationFrame
    );

    stopAllVideos();

    currentTime = 0;
    currentClipIndex = -1;

    audio.currentTime = 0;

    /*
      Canvas stream.
    */

    const canvasStream =
      canvas.captureStream(60);

    /*
      Audio graph.
    */

    if(!audioContext){

      const AC =
        window.AudioContext ||
        window.webkitAudioContext;

      audioContext =
        new AC();
    }

    if(
      audioContext.state ===
      "suspended"
    ){

      await audioContext.resume();
    }

    if(!audioGraphConnected){

      audioSource =
        audioContext.createMediaElementSource(
          audio
        );

      audioDestination =
        audioContext.createMediaStreamDestination();

      audioSource.connect(
        audioContext.destination
      );

      audioSource.connect(
        audioDestination
      );

      audioGraphConnected =
        true;
    }

    const stream =
      new MediaStream();

    for(
      const track of
      canvasStream.getVideoTracks()
    ){

      stream.addTrack(track);
    }

    for(
      const track of
      audioDestination.getAudioTracks()
    ){

      stream.addTrack(track);
    }

    let mime = "";

    const mimeTypes = [

      "video/webm;codecs=vp9,opus",

      "video/webm;codecs=vp8,opus",

      "video/webm"

    ];

    for(
      const type of mimeTypes
    ){

      if(
        MediaRecorder.isTypeSupported(type)
      ){

        mime = type;
        break;
      }
    }

    if(!mime){

      setMessage(
        "WebM recording is not supported in this browser."
      );

      exporting = false;

      updateButtons();

      return;
    }

    const recorder =
      new MediaRecorder(
        stream,
        {
          mimeType:mime,
          videoBitsPerSecond:8000000,
          audioBitsPerSecond:192000
        }
      );

    const chunks = [];

    recorder.ondataavailable =
      e=>{

        if(
          e.data &&
          e.data.size
        ){

          chunks.push(e.data);
        }
      };

    const stopped =
      new Promise(resolve=>{

        recorder.onstop =
          resolve;

      });

    recorder.start(250);

    /*
      Export starts at timeline zero.
    */

    playing = true;

    await audio.play();

    await new Promise(resolve=>{

      let lastWall =
        performance.now();

      function exportLoop(){

        if(!exporting){

          resolve();
          return;
        }

        const now =
          performance.now();

        /*
          Normal case:
          audio is the master clock.
        */

        let time =
          audio.currentTime;

        /*
          Video-only tail:
          continue after audio has ended.

          This uses a monotonic accumulated clock.
        */

        if(
          audio.ended &&
          totalDuration > audio.duration
        ){

          time =
            Math.max(
              currentTime,
              audio.duration
            );

          time +=
            (now-lastWall)/1000;
        }

        lastWall =
          now;

        currentTime =
          time;

        /*
          End.
        */

        if(
          currentTime >=
          totalDuration
        ){

          currentTime =
            totalDuration;

          resolve();

          return;
        }

        const found =
          findClip(currentTime);

        if(found){

          enterClip(
            found,
            currentTime
          );
        }

        renderFrame(
          currentTime
        );

        progress.style.width =
          clamp(
            currentTime /
            Math.max(
              totalDuration,
              .001
            ) *
            100,
            0,
            100
          ) + "%";

        timeLabel.textContent =
          formatTime(currentTime);

        requestAnimationFrame(
          exportLoop
        );
      }

      requestAnimationFrame(
        exportLoop
      );
    });

    /*
      Finish.
    */

    try{
      audio.pause();
    }catch(e){}

    stopAllVideos();

    await new Promise(
      resolve =>
        setTimeout(resolve,120)
    );

    recorder.stop();

    await stopped;

    const blob =
      new Blob(
        chunks,
        {
          type:mime
        }
      );

    const url =
      URL.createObjectURL(blob);

    const link =
      document.createElement("a");

    link.href =
      url;

    link.download =
      "john-banana-auto-edit.webm";

    document.body.appendChild(link);

    link.click();

    link.remove();

    setTimeout(
      ()=>{
        URL.revokeObjectURL(url);
      },
      5000
    );

    exporting = false;
    playing = false;
    paused = false;

    pauseIcon.textContent =
      "▶";

    pauseOverlay.classList.add(
      "show"
    );

    updateButtons();

    setMessage(
      "DONE. WebM exported successfully. 🍌🔥"
    );
  }
);


/* =========================================================
   INITIALISE
========================================================= */

drawPlaceholder();

updateButtons();

</script>
