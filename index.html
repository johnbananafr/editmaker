<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JOHN BANANA — AUTO EDIT MAKER</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=DM+Mono:wght@400;500;700&family=Inter:wght@500;600;700;800;900&display=swap');

:root{
  --purple:#ab04f9;
  --dark:#7800ad;
  --light:#d96cff;
  --cream:#f4efe5;
  --red:#ff304f;
  --yellow:#ffe600;
  --black:#080609;
  --green:#43e36f;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 10%,rgba(171,4,249,.12),transparent 30%),
    radial-gradient(circle at 80% 90%,rgba(255,48,79,.08),transparent 30%),
    var(--cream);
  color:var(--black);
  font-family:Inter,Arial,sans-serif;
}

.wrap{
  width:min(1100px,94vw);
  margin:0 auto;
  padding:30px 0 60px;
}

header{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:25px;
}

.logo{
  font-family:Bangers,cursive;
  font-size:clamp(42px,8vw,78px);
  line-height:.8;
  color:var(--purple);
  letter-spacing:2px;
  text-shadow:4px 4px 0 var(--black);
  transform:rotate(-2deg);
}

.logo span{
  color:var(--red);
}

.subtitle{
  font-family:"DM Mono",monospace;
  font-size:12px;
  font-weight:700;
  max-width:300px;
  text-align:right;
  line-height:1.5;
}

.layout{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:28px;
}

.panel{
  background:#fff;
  border:3px solid var(--black);
  border-radius:18px;
  padding:20px;
  box-shadow:8px 8px 0 var(--black);
}

.panel h2{
  margin:0 0 15px;
  font-family:Bangers,cursive;
  font-size:28px;
  letter-spacing:1px;
}

.imports{
  display:grid;
  gap:10px;
}

.importBtn{
  border:3px solid var(--black);
  background:white;
  padding:14px;
  border-radius:12px;
  font-weight:900;
  cursor:pointer;
  text-align:left;
  transition:.12s;
}

.importBtn:hover{
  transform:translate(-2px,-2px);
  box-shadow:4px 4px 0 var(--black);
}

.importBtn.photo{
  background:#fff;
}

.importBtn.video{
  background:#e9d3ff;
}

.importBtn.audio{
  background:#fff2a6;
}

input[type=file]{
  display:none;
}

.status{
  margin-top:14px;
  display:grid;
  gap:7px;
}

.statusRow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 10px;
  background:#f1eee7;
  border-radius:8px;
  font-family:"DM Mono",monospace;
  font-size:11px;
}

.statusRow strong{
  color:var(--purple);
}

.control{
  margin-top:20px;
}

.control label{
  display:flex;
  justify-content:space-between;
  font-family:"DM Mono",monospace;
  font-size:12px;
  font-weight:700;
  margin-bottom:8px;
}

input[type=range]{
  width:100%;
  accent-color:var(--purple);
}

.buttons{
  display:grid;
  gap:10px;
  margin-top:20px;
}

button{
  border:3px solid var(--black);
  border-radius:12px;
  padding:14px 16px;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  background:white;
}

button.primary{
  background:var(--purple);
  color:white;
}

button.export{
  background:var(--yellow);
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.message{
  min-height:42px;
  margin-top:15px;
  padding:10px;
  border:2px dashed var(--black);
  border-radius:10px;
  font-family:"DM Mono",monospace;
  font-size:11px;
  line-height:1.45;
}

.previewPanel{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.previewWrap{
  position:relative;
  width:min(100%,540px);
  aspect-ratio:9/16;
  background:#111;
  border:4px solid var(--black);
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  user-select:none;
  touch-action:manipulation;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

.pauseOverlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  opacity:0;
  transition:.15s;
}

.pauseIcon{
  width:82px;
  height:82px;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:900;
}

.pauseOverlay.show{
  opacity:1;
}

.previewHint{
  margin-top:10px;
  font-family:"DM Mono",monospace;
  font-size:11px;
  font-weight:700;
}

.progressOuter{
  width:100%;
  max-width:540px;
  height:10px;
  background:#ddd;
  border:2px solid var(--black);
  border-radius:99px;
  margin-top:14px;
  overflow:hidden;
}

.progressInner{
  width:0%;
  height:100%;
  background:var(--purple);
}

.timelineInfo{
  width:100%;
  max-width:540px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:7px;
  font-family:"DM Mono",monospace;
  font-size:11px;
  font-weight:700;
}

@media(max-width:800px){
  .layout{
    grid-template-columns:1fr;
  }

  .previewPanel{
    order:-1;
  }

  header{
    align-items:flex-start;
    flex-direction:column;
  }

  .subtitle{
    text-align:left;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <div class="logo">
    AUTO <span>EDIT</span>
  </div>

  <div class="subtitle">
    JOHN BANANA'S COMPLETELY AUTOMATIC<br>
    BEAT-SYNCED EDIT MACHINE™
  </div>
</header>

<div class="layout">

  <section class="panel">

    <h2>IMPORT STUFF</h2>

    <div class="imports">

      <button class="importBtn photo" id="photoButton">
        📸 ADD PHOTOS
      </button>

      <button class="importBtn video" id="videoButton">
        🎬 ADD VIDEOS
      </button>

      <button class="importBtn audio" id="audioButton">
        🔊 ADD MUSIC
      </button>

    </div>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
      multiple
    >

    <input
      id="videoInput"
      type="file"
      accept="video/*,.mp4,.mov,.webm,.m4v"
      multiple
    >

    <input
      id="audioInput"
      type="file"
      accept=".mp3,.m4a,.wav,.aac,.caf,.ogg,.opus,audio/*"
    >

    <div class="status">

      <div class="statusRow">
        <span>PHOTOS</span>
        <strong id="photoCount">0</strong>
      </div>

      <div class="statusRow">
        <span>VIDEOS</span>
        <strong id="videoCount">0</strong>
      </div>

      <div class="statusRow">
        <span>MUSIC</span>
        <strong id="audioStatus">NONE</strong>
      </div>

      <div class="statusRow">
        <span>BEATS</span>
        <strong id="beatCount">0</strong>
      </div>

    </div>

    <div class="control">

      <label>
        <span>BEAT SENSITIVITY</span>
        <span id="sensitivityValue">50</span>
      </label>

      <input
        id="sensitivity"
        type="range"
        min="0"
        max="100"
        value="50"
      >

    </div>

    <div class="buttons">

      <button
        id="generateButton"
        class="primary"
        disabled
      >
        ⚡ GENERATE EDIT
      </button>

      <button
        id="exportButton"
        class="export"
        disabled
      >
        💾 EXPORT WEBM
      </button>

    </div>

    <div class="message" id="message">
      Add some photos, videos and music.
    </div>

  </section>


  <section class="panel previewPanel">

    <div
      class="previewWrap"
      id="previewWrap"
      title="Click/tap to pause or play"
    >

      <canvas
        id="canvas"
        width="540"
        height="960"
      ></canvas>

      <div class="pauseOverlay" id="pauseOverlay">
        <div class="pauseIcon" id="pauseIcon">Ⅱ</div>
      </div>

    </div>

    <div class="previewHint">
      TAP / CLICK THE VIDEO TO PAUSE OR PLAY
    </div>

    <div class="progressOuter">
      <div class="progressInner" id="progress"></div>
    </div>

    <div class="timelineInfo">
      <span id="timeLabel">00:00</span>
      <span id="clipLabel">READY</span>
      <span id="durationLabel">00:00</span>
    </div>

  </section>

</div>

</div>


<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const previewWrap = document.getElementById("previewWrap");
const pauseOverlay = document.getElementById("pauseOverlay");
const pauseIcon = document.getElementById("pauseIcon");

const photoInput = document.getElementById("photoInput");
const videoInput = document.getElementById("videoInput");
const audioInput = document.getElementById("audioInput");

const photoButton = document.getElementById("photoButton");
const videoButton = document.getElementById("videoButton");
const audioButton = document.getElementById("audioButton");

const generateButton = document.getElementById("generateButton");
const exportButton = document.getElementById("exportButton");

const photoCount = document.getElementById("photoCount");
const videoCount = document.getElementById("videoCount");
const audioStatus = document.getElementById("audioStatus");
const beatCount = document.getElementById("beatCount");

const sensitivity = document.getElementById("sensitivity");
const sensitivityValue = document.getElementById("sensitivityValue");

const message = document.getElementById("message");
const progress = document.getElementById("progress");

const timeLabel = document.getElementById("timeLabel");
const durationLabel = document.getElementById("durationLabel");
const clipLabel = document.getElementById("clipLabel");


/* =========================================================
   STATE
========================================================= */

let photos = [];
let videos = [];

let audioFile = null;
let audio = null;
let audioURL = null;

let audioContext = null;
let audioSource = null;
let audioDestination = null;
let audioGraphConnected = false;

let beats = [];
let sequence = [];

let generated = false;
let generating = false;
let exporting = false;
let playing = false;

let paused = false;

let animationFrame = null;

let currentTime = 0;
let totalDuration = 0;

let playStartTime = 0;

let currentClipIndex = -1;


/*
  Video state.

  IMPORTANT:
  A video is NEVER controlled by:
      currentTime = timelineTime % duration

  and NEVER restarted every animation frame.

  Each imported video owns one continuous section
  of the edit timeline.
*/
let activeVideo = null;
let activeVideoIndex = -1;
let videoClipStartedAt = 0;
let lastVideoCorrection = 0;


/* =========================================================
   HELPERS
========================================================= */

function setMessage(text){
  message.textContent = text;
}

function formatTime(seconds){
  seconds = Math.max(0, Number(seconds) || 0);

  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);

  return (
    String(mins).padStart(2,"0") +
    ":" +
    String(secs).padStart(2,"0")
  );
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function sleep(ms){
  return new Promise(resolve => setTimeout(resolve,ms));
}


/* =========================================================
   FILE IMPORT
========================================================= */

photoButton.addEventListener("click",()=>{
  photoInput.click();
});

videoButton.addEventListener("click",()=>{
  videoInput.click();
});

audioButton.addEventListener("click",()=>{
  audioInput.click();
});


photoInput.addEventListener("change",async e=>{

  const files = [...e.target.files];

  for(const file of files){

    const url = URL.createObjectURL(file);

    const img = new Image();

    img.src = url;

    await new Promise(resolve=>{
      img.onload = resolve;
      img.onerror = resolve;
    });

    photos.push({
      file,
      url,
      img
    });
  }

  photoInput.value = "";

  photoCount.textContent = photos.length;

  drawPlaceholder();

  updateButtons();

  setMessage(
    photos.length +
    " photo" +
    (photos.length === 1 ? "" : "s") +
    " loaded."
  );
});


videoInput.addEventListener("change",async e=>{

  const files = [...e.target.files];

  for(const file of files){

    const url = URL.createObjectURL(file);

    const video = document.createElement("video");

    video.preload = "auto";
    video.playsInline = true;
    video.muted = true;
    video.controls = false;
    video.loop = false;

    video.src = url;

    await waitForVideo(video);

    videos.push({
      file,
      url,
      video,
      duration: Number.isFinite(video.duration)
        ? video.duration
        : 0
    });
  }

  videoInput.value = "";

  videoCount.textContent = videos.length;

  drawPlaceholder();

  updateButtons();

  setMessage(
    videos.length +
    " video" +
    (videos.length === 1 ? "" : "s") +
    " loaded. Videos will play FIRST."
  );
});


audioInput.addEventListener("change",async e=>{

  const file = e.target.files[0];

  if(!file) return;

  if(audioURL){
    URL.revokeObjectURL(audioURL);
  }

  audioFile = file;

  audioURL = URL.createObjectURL(file);

  audio = new Audio();

  audio.src = audioURL;
  audio.preload = "auto";
  audio.crossOrigin = "anonymous";

  await new Promise(resolve=>{
    if(audio.readyState >= 1){
      resolve();
      return;
    }

    audio.addEventListener("loadedmetadata",resolve,{
      once:true
    });
  });

  audioStatus.textContent = formatTime(audio.duration);

  audioInput.value = "";

  updateButtons();

  setMessage("Music loaded. Ready to detect the beat.");
});


function waitForVideo(video){

  return new Promise(resolve=>{

    if(video.readyState >= 2){
      resolve();
      return;
    }

    let finished = false;

    const done = ()=>{
      if(finished) return;
      finished = true;
      cleanup();
      resolve();
    };

    const cleanup = ()=>{
      video.removeEventListener("loadeddata",done);
      video.removeEventListener("canplay",done);
      video.removeEventListener("error",done);
    };

    video.addEventListener("loadeddata",done);
    video.addEventListener("canplay",done);
    video.addEventListener("error",done);

  });
}


/* =========================================================
   BUTTON STATE
========================================================= */

function updateButtons(){

  const ready =
    photos.length > 0 ||
    videos.length > 0;

  generateButton.disabled =
    !audio ||
    !ready ||
    generating ||
    exporting;

  exportButton.disabled =
    !generated ||
    generating ||
    exporting;
}


/* =========================================================
   SENSITIVITY
========================================================= */

sensitivity.addEventListener("input",()=>{
  sensitivityValue.textContent = sensitivity.value;
});


/* =========================================================
   DRAWING
========================================================= */

function drawCover(source){

  const sw = source.videoWidth || source.naturalWidth || source.width;
  const sh = source.videoHeight || source.naturalHeight || source.height;

  if(!sw || !sh){
    ctx.fillStyle = "#111";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    return;
  }

  const scale = Math.max(
    canvas.width / sw,
    canvas.height / sh
  );

  const dw = sw * scale;
  const dh = sh * scale;

  const dx = (canvas.width - dw) / 2;
  const dy = (canvas.height - dh) / 2;

  ctx.drawImage(
    source,
    dx,
    dy,
    dw,
    dh
  );
}


function drawVideoCover(video){

  ctx.save();

  ctx.translate(
    canvas.width / 2,
    canvas.height / 2
  );

  const sw = video.videoWidth;
  const sh = video.videoHeight;

  if(!sw || !sh){
    ctx.restore();
    return;
  }

  const scale = Math.max(
    canvas.width / sw,
    canvas.height / sh
  );

  const dw = sw * scale;
  const dh = sh * scale;

  ctx.drawImage(
    video,
    -dw / 2,
    -dh / 2,
    dw,
    dh
  );

  ctx.restore();
}


function drawPlaceholder(){

  ctx.fillStyle = "#111";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#fff";

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.font = "900 38px Inter";

  ctx.fillText(
    "JOHN BANANA",
    canvas.width / 2,
    canvas.height / 2 - 25
  );

  ctx.font = "700 16px DM Mono";

  ctx.fillText(
    "AUTO EDIT MAKER",
    canvas.width / 2,
    canvas.height / 2 + 25
  );
}


/* =========================================================
   PHOTO PHYSICS
========================================================= */

/*
  PHOTO SHAKE.

  This is deliberately independent from the video system.

  The important part:
  - beat strength controls intensity
  - local photo time controls the decay
  - deterministic movement means export and preview match
  - no video timing is involved
*/

function seededRandom(n){

  const x = Math.sin(n * 12.9898) * 43758.5453;

  return x - Math.floor(x);
}


function applyShake(time,beatStrength,clipIndex){

  const strength = clamp(
    Number(beatStrength) || 0,
    0,
    1
  );

  const seed =
    (clipIndex + 1) * 71.317 +
    Math.floor(time * 60) * 13.77;

  const r1 = seededRandom(seed);
  const r2 = seededRandom(seed + 4.17);
  const r3 = seededRandom(seed + 9.81);

  /*
    Keep the aggressive photo feel.
  */

  const shake =
    Math.pow(strength,0.82) *
    18;

  const x =
    (r1 - .5) *
    shake;

  const y =
    (r2 - .5) *
    shake;

  const rotation =
    (r3 - .5) *
    strength *
    0.045;

  const zoom =
    1 +
    strength * .055;

  ctx.translate(
    canvas.width / 2 + x,
    canvas.height / 2 + y
  );

  ctx.rotate(rotation);

  ctx.scale(zoom,zoom);
}


/* =========================================================
   VIDEO MOTION
========================================================= */

function applyVideoShake(time,beatStrength){

  const strength = clamp(
    Number(beatStrength) || 0,
    0,
    1
  );

  /*
    Smooth motion for video.
    No random per-frame jumps.
  */

  const pulse =
    Math.sin(time * 42) *
    strength *
    3;

  const pulseY =
    Math.cos(time * 37) *
    strength *
    2;

  const rotation =
    Math.sin(time * 31) *
    strength *
    0.008;

  const zoom =
    1 +
    strength * 0.018;

  ctx.translate(
    canvas.width / 2 + pulse,
    canvas.height / 2 + pulseY
  );

  ctx.rotate(rotation);

  ctx.scale(zoom,zoom);
}


/* =========================================================
   BEAT DETECTION
========================================================= */

async function detectBeats(){

  if(!audioFile){
    beats = [];
    return;
  }

  setMessage("Listening to the music... 👂");

  const arrayBuffer =
    await audioFile.arrayBuffer();

  const tempContext =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  const audioBuffer =
    await tempContext.decodeAudioData(
      arrayBuffer.slice(0)
    );

  await tempContext.close();

  const sampleRate = audioBuffer.sampleRate;

  const channelCount = audioBuffer.numberOfChannels;

  const length = audioBuffer.length;

  const mono = new Float32Array(length);

  for(let c=0;c<channelCount;c++){

    const data =
      audioBuffer.getChannelData(c);

    for(let i=0;i<length;i++){
      mono[i] += data[i] / channelCount;
    }
  }

  const windowSize =
    Math.max(
      256,
      Math.floor(sampleRate * 0.025)
    );

  const hop =
    Math.floor(windowSize * .5);

  const energies = [];

  for(
    let i=0;
    i + windowSize < mono.length;
    i += hop
  ){

    let sum = 0;

    for(let j=0;j<windowSize;j++){

      const s = mono[i+j];

      sum += s * s;
    }

    energies.push({
      time:i / sampleRate,
      energy:Math.sqrt(sum / windowSize)
    });
  }

  if(!energies.length){
    beats = [];
    return;
  }

  /*
    Smooth the energy curve.
  */

  const smooth = [];

  const radius = 3;

  for(let i=0;i<energies.length;i++){

    let sum = 0;
    let count = 0;

    for(
      let j=Math.max(0,i-radius);
      j<=Math.min(energies.length-1,i+radius);
      j++
    ){

      sum += energies[j].energy;
      count++;
    }

    smooth.push({
      time:energies[i].time,
      energy:sum / count
    });
  }

  /*
    Adaptive threshold.
  */

  const sens =
    Number(sensitivity.value) / 100;

  const recent = [];

  const detected = [];

  let lastBeat = -Infinity;

  const minGap =
    0.175 -
    sens * 0.03;

  for(let i=2;i<smooth.length-2;i++){

    const current = smooth[i].energy;

    if(current <= smooth[i-1].energy) continue;
    if(current < smooth[i+1].energy) continue;

    recent.push(current);

    if(recent.length > 40){
      recent.shift();
    }

    const avg =
      recent.reduce((a,b)=>a+b,0) /
      recent.length;

    const variance =
      recent.reduce(
        (a,b)=>a + Math.pow(b-avg,2),
        0
      ) /
      recent.length;

    const deviation =
      Math.sqrt(variance);

    const threshold =
      avg +
      deviation *
      (1.7 - sens * .65);

    if(current < threshold) continue;

    const time = smooth[i].time;

    if(time - lastBeat < minGap) continue;

    const strength =
      clamp(
        (current - avg) /
        Math.max(
          deviation * 2.5,
          .00001
        ),
        0,
        1
      );

    detected.push({
      time,
      strength
    });

    lastBeat = time;

    if(detected.length >= 900){
      break;
    }
  }

  /*
    If detection is extremely sparse,
    provide a musical fallback.
  */

  if(detected.length < 4){

    const bpm = 150;

    const interval = 60 / bpm;

    beats = [];

    for(
      let t=0;
      t<audioBuffer.duration;
      t+=interval
    ){

      beats.push({
        time:t,
        strength:.6
      });
    }

  }else{

    beats = detected;
  }

  beatCount.textContent = beats.length;

  setMessage(
    beats.length +
    " beats detected. Generate the edit."
  );
}


/* =========================================================
   BUILD SEQUENCE
========================================================= */

function buildSequence(){

  sequence = [];

  const audioDuration =
    audio && Number.isFinite(audio.duration)
      ? audio.duration
      : 0;

  /*
    ---------------------------------------------------------
    VIDEOS FIRST
    ---------------------------------------------------------

    Every video gets one continuous timeline section.

    Video 1:
      0 -> duration 1

    Video 2:
      duration 1 -> duration 1 + duration 2

    Video 3:
      ... etc.

    THERE IS NO PHOTO BETWEEN THEM.
  */

  let timeline = 0;

  for(let i=0;i<videos.length;i++){

    const item = videos[i];

    const duration =
      Number.isFinite(item.duration) &&
      item.duration > 0
        ? item.duration
        : item.video.duration;

    if(!duration || !Number.isFinite(duration)){
      continue;
    }

    sequence.push({
      type:"video",
      source:item.video,
      sourceIndex:i,
      start:timeline,
      end:timeline + duration
    });

    timeline += duration;
  }

  /*
    ---------------------------------------------------------
    PHOTOS START IMMEDIATELY AFTER FINAL VIDEO
    ---------------------------------------------------------
  */

  const photoStart = timeline;

  /*
    If the video collection already fills the entire
    music track, there is no photo section.
  */

  if(photos.length){

    let photoTimeline = photoStart;

    let photoIndex = 0;

    /*
      Use detected beats after the video section.

      The photo begins exactly at the end of the last video.
    */

    const photoBeats = beats.filter(
      beat => beat.time >= photoStart
    );

    if(photoBeats.length){

      for(let i=0;i<photoBeats.length;i++){

        const start =
          i === 0
            ? photoStart
            : photoBeats[i].time;

        const next =
          i + 1 < photoBeats.length
            ? photoBeats[i+1].time
            : audioDuration;

        if(next <= start) continue;

        sequence.push({
          type:"photo",
          source:photos[
            photoIndex % photos.length
          ].img,
          sourceIndex:
            photoIndex % photos.length,
          start,
          end:next
        });

        photoIndex++;
      }

    }else if(photoStart < audioDuration){

      /*
        No usable beats after the videos.

        Split the remaining audio reasonably between photos.
      */

      const remaining =
        audioDuration - photoStart;

      const durationPerPhoto =
        remaining /
        Math.max(1,photos.length);

      for(
        let i=0;
        i<photos.length;
        i++
      ){

        const start =
          photoStart +
          i * durationPerPhoto;

        const end =
          i === photos.length - 1
            ? audioDuration
            : start + durationPerPhoto;

        if(end <= start) continue;

        sequence.push({
          type:"photo",
          source:photos[i].img,
          sourceIndex:i,
          start,
          end
        });
      }
    }
  }

  /*
    ---------------------------------------------------------
    TOTAL DURATION
    ---------------------------------------------------------

    If videos extend beyond the audio, the edit needs to
    continue until the final video ends.

    Normally the music should be long enough, but this makes
    the timeline robust.
  */

  totalDuration =
    Math.max(
      audioDuration,
      timeline
    );

  durationLabel.textContent =
    formatTime(totalDuration);

  return sequence;
}


/* =========================================================
   CLIP LOOKUP
========================================================= */

function findClip(time){

  if(!sequence.length) return null;

  /*
    Exact end boundaries belong to the NEXT clip.

    This is important because it means:

      video ends
          ↓
      photo starts IMMEDIATELY

    instead of displaying the last video frame for
    another beat/frame.
  */

  for(let i=0;i<sequence.length;i++){

    const clip = sequence[i];

    if(
      time >= clip.start &&
      time < clip.end
    ){
      return {
        clip,
        index:i
      };
    }
  }

  /*
    At the absolute end, return the final clip so the
    last frame can still be rendered.
  */

  if(
    time >= totalDuration &&
    sequence.length
  ){

    return {
      clip:sequence[sequence.length-1],
      index:sequence.length-1
    };
  }

  return null;
}


/* =========================================================
   BEAT STRENGTH
========================================================= */

function getBeatStrength(time){

  if(!beats.length) return 0;

  let strength = 0;

  for(let i=beats.length-1;i>=0;i--){

    const beat = beats[i];

    const diff =
      time - beat.time;

    if(diff < 0) continue;

    if(diff > .16) break;

    const decay =
      1 -
      diff / .16;

    strength =
      Math.max(
        strength,
        beat.strength * decay
      );

    break;
  }

  return clamp(strength,0,1);
}


/* =========================================================
   STOP ALL VIDEOS
========================================================= */

function stopAllVideos(){

  for(const item of videos){

    try{
      item.video.pause();
    }catch(e){}

  }

  activeVideo = null;
  activeVideoIndex = -1;
  videoClipStartedAt = 0;
}


/* =========================================================
   START VIDEO
========================================================= */

async function startCurrentVideo(
  video,
  index,
  timelineTime
){

  /*
    CRITICAL:

    If this is already the active video,
    DO NOT restart it.
  */

  if(
    activeVideo === video &&
    activeVideoIndex === index
  ){
    return;
  }

  stopAllVideos();

  activeVideo = video;
  activeVideoIndex = index;

  /*
    This is the EXACT point on the master timeline
    at which this video began.
  */

  videoClipStartedAt =
    timelineTime;

  lastVideoCorrection = 0;

  video.loop = false;

  /*
    Every video starts exactly once at 0.
  */

  try{
    video.currentTime = 0;
  }catch(e){}

  await waitForVideoReady(video);

  /*
    The user may have paused while the video was loading.
  */

  if(
    !playing ||
    paused ||
    activeVideo !== video
  ){
    return;
  }

  try{
    await video.play();
  }catch(e){
    /*
      Autoplay restrictions should not kill the editor.
      The user already interacted with the page.
    */
  }
}


function waitForVideoReady(video){

  return new Promise(resolve=>{

    if(
      video.readyState >= 2 &&
      video.videoWidth > 0
    ){
      resolve();
      return;
    }

    let done = false;

    const finish = ()=>{
      if(done) return;

      done = true;

      video.removeEventListener(
        "loadeddata",
        finish
      );

      video.removeEventListener(
        "canplay",
        finish
      );

      resolve();
    };

    video.addEventListener(
      "loadeddata",
      finish,
      {once:true}
    );

    video.addEventListener(
      "canplay",
      finish,
      {once:true}
    );

  });
}


/* =========================================================
   KEEP VIDEO IN SYNC
========================================================= */

function keepVideoInSync(
  video,
  timelineTime
){

  if(!video) return;

  /*
    Expected video time is simply:

      timeline position
      -
      video's timeline start
  */

  const expected =
    clamp(
      timelineTime -
      videoClipStartedAt,
      0,
      Math.max(0,video.duration - .001)
    );

  /*
    DO NOT seek every frame.

    That was the source of the old:
      - looping
      - glitching
      - first 0.2 second
      - stuttering
    behaviour.

    We only correct genuine drift.
  */

  if(
    Math.abs(
      video.currentTime - expected
    ) > .5
  ){

    try{
      video.currentTime = expected;
    }catch(e){}
  }

  /*
    If the video somehow stopped before its natural end,
    resume it.

    But NEVER restart it once the clip has moved on.
  */

  if(
    video.paused &&
    playing &&
    !paused &&
    expected < video.duration - .08
  ){

    video.play().catch(()=>{});
  }
}


/* =========================================================
   VIDEO TIMELINE SYNC
========================================================= */

function syncVideoToTimeline(
  video,
  index,
  timelineTime
){

  /*
    New video:
      stop old
      reset new to 0
      play new

    Same video:
      do NOTHING except occasional drift correction
  */

  if(
    activeVideo !== video ||
    activeVideoIndex !== index
  ){

    startCurrentVideo(
      video,
      index,
      timelineTime
    );

    return;
  }

  keepVideoInSync(
    video,
    timelineTime
  );
}


/* =========================================================
   RENDER FRAME
========================================================= */

function renderFrame(time){

  const found =
    findClip(time);

  if(!found){

    drawPlaceholder();

    return;
  }

  const clip =
    found.clip;

  const index =
    found.index;

  const localTime =
    Math.max(
      0,
      time - clip.start
    );

  const beatStrength =
    getBeatStrength(time);

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  /*
    VIDEO
  */

  if(clip.type === "video"){

    const video =
      clip.source;

    ctx.save();

    applyVideoShake(
      localTime,
      beatStrength
    );

    drawVideoCover(video);

    ctx.restore();

  }

  /*
    PHOTO
  */

  else{

    const img =
      clip.source;

    ctx.save();

    /*
      IMPORTANT:
      Photo shake is only applied here.
      Video physics never touch it.
    */

    applyShake(
      localTime,
      beatStrength,
      index
    );

    drawCover(img);

    ctx.restore();
  }

  /*
    Beat flash.
  */

  if(beatStrength > .72){

    const alpha =
      (beatStrength - .72) * .25;

    ctx.fillStyle =
      `rgba(255,255,255,${alpha})`;

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );
  }

  /*
    Labels.
  */

  if(clip.type === "video"){

    clipLabel.textContent =
      "VIDEO " +
      (clip.sourceIndex + 1) +
      " / " +
      videos.length;

  }else{

    clipLabel.textContent =
      "PHOTO " +
      (clip.sourceIndex + 1) +
      " / " +
      photos.length;
  }
}


/* =========================================================
   MASTER ANIMATION LOOP
========================================================= */

function animationLoop(){

  if(!playing) return;

  if(paused){

    animationFrame =
      requestAnimationFrame(animationLoop);

    return;
  }

  /*
    AUDIO is the master clock when it is running.

    During export the audio is also running.

    For video-only overflow, performance time is used
    after audio reaches its end.
  */

  let time;

  if(
    audio &&
    Number.isFinite(audio.currentTime)
  ){

    time = audio.currentTime;

    /*
      If audio has ended but the final video is longer,
      continue the timeline.
    */

    if(
      audio.ended &&
      totalDuration > audio.duration
    ){

      time =
        Math.min(
          totalDuration,
          playStartTime +
          (performance.now() - playStartTime) / 1000
        );
    }

  }else{

    time =
      (performance.now() -
       playStartTime) / 1000;
  }

  currentTime = time;

  /*
    END.
  */

  if(
    currentTime >= totalDuration
  ){

    currentTime =
      totalDuration;

    renderFrame(currentTime);

    stopPlayback();

    return;
  }

  const found =
    findClip(currentTime);

  if(found){

    /*
      Detect actual clip transitions.

      This is what gives us:

        VIDEO 1
           ↓
        VIDEO 2
           ↓
        VIDEO 3
           ↓
        PHOTO

      with no artificial gap.
    */

    if(found.index !== currentClipIndex){

      currentClipIndex =
        found.index;

      if(found.clip.type === "video"){

        syncVideoToTimeline(
          found.clip.source,
          found.clip.sourceIndex,
          currentTime
        );

      }else{

        /*
          THE INSTANT WE HIT THE PHOTO:

          kill every video.

          This prevents the final video's last frame
          from hanging around over the photo.
        */

        stopAllVideos();
      }
    }

    /*
      Keep active video alive without restarting it.
    */

    if(found.clip.type === "video"){

      syncVideoToTimeline(
        found.clip.source,
        found.clip.sourceIndex,
        currentTime
      );
    }
  }

  renderFrame(currentTime);

  const pct =
    totalDuration > 0
      ? currentTime / totalDuration
      : 0;

  progress.style.width =
    clamp(pct * 100,0,100) + "%";

  timeLabel.textContent =
    formatTime(currentTime);

  animationFrame =
    requestAnimationFrame(animationLoop);
}


/* =========================================================
   START PLAYBACK
========================================================= */

async function startPlayback(){

  if(!audio || !generated) return;

  cancelAnimationFrame(animationFrame);

  stopAllVideos();

  paused = false;
  playing = true;

  currentClipIndex = -1;
  currentTime = 0;

  audio.currentTime = 0;

  /*
    Audio graph.
  */

  if(!audioContext){

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
  }

  if(audioContext.state === "suspended"){
    await audioContext.resume();
  }

  if(!audioGraphConnected){

    audioSource =
      audioContext.createMediaElementSource(audio);

    audioDestination =
      audioContext.createMediaStreamDestination();

    audioSource.connect(
      audioContext.destination
    );

    audioSource.connect(
      audioDestination
    );

    audioGraphConnected = true;
  }

  playStartTime =
    performance.now();

  pauseOverlay.classList.remove("show");
  pauseIcon.textContent = "Ⅱ";

  await audio.play();

  animationFrame =
    requestAnimationFrame(animationLoop);
}


/* =========================================================
   STOP PLAYBACK
========================================================= */

function stopPlayback(){

  playing = false;
  paused = false;

  cancelAnimationFrame(animationFrame);

  stopAllVideos();

  if(audio){

    try{
      audio.pause();
    }catch(e){}
  }

  pauseOverlay.classList.remove("show");
  pauseIcon.textContent = "▶";

  if(currentTime >= totalDuration){

    progress.style.width = "100%";

    timeLabel.textContent =
      formatTime(totalDuration);
  }
}


/* =========================================================
   PAUSE / PLAY
========================================================= */

async function togglePlayback(){

  if(!generated) return;

  /*
    Not currently running:
    start it.
  */

  if(!playing){

    await startPlayback();

    return;
  }

  /*
    PAUSE
  */

  if(!paused){

    paused = true;

    if(audio){
      audio.pause();
    }

    for(const item of videos){

      try{
        item.video.pause();
      }catch(e){}
    }

    pauseIcon.textContent = "▶";

    pauseOverlay.classList.add("show");

    return;
  }

  /*
    PLAY AGAIN
  */

  paused = false;

  if(audioContext &&
     audioContext.state === "suspended"){

    await audioContext.resume();
  }

  if(audio){

    await audio.play();
  }

  if(activeVideo){

    activeVideo.play().catch(()=>{});
  }

  pauseIcon.textContent = "Ⅱ";

  pauseOverlay.classList.remove("show");
}


/*
  CLICK/TAP PREVIEW

  This was accidentally lost before.
*/

previewWrap.addEventListener(
  "click",
  async ()=>{
    await togglePlayback();
  }
);


/*
  Prevent double triggering on touch devices.
*/

previewWrap.addEventListener(
  "dblclick",
  e=>{
    e.preventDefault();
  }
);


/* =========================================================
   GENERATE
========================================================= */

generateButton.addEventListener(
  "click",
  async ()=>{

    if(generating) return;

    generating = true;

    updateButtons();

    stopPlayback();

    try{

      if(!audio){

        throw new Error(
          "Add music first."
        );
      }

      setMessage(
        "Detecting beats... this thing is listening 👂"
      );

      await detectBeats();

      /*
        IMPORTANT:
        Build sequence AFTER beat detection.
      */

      buildSequence();

      if(!sequence.length){

        throw new Error(
          "Couldn't create a timeline."
        );
      }

      generated = true;

      currentTime = 0;

      currentClipIndex = -1;

      stopAllVideos();

      renderFrame(0);

      progress.style.width = "0%";

      timeLabel.textContent = "00:00";

      setMessage(
        "EDIT GENERATED. Tap the preview to play/pause. 🔥"
      );

    }catch(err){

      console.error(err);

      generated = false;

      setMessage(
        "Generation failed: " +
        (err.message || err)
      );

    }finally{

      generating = false;

      updateButtons();
    }
  }
);


/* =========================================================
   EXPORT WEBM
========================================================= */

exportButton.addEventListener(
  "click",
  async ()=>{

    if(
      exporting ||
      !generated ||
      !audio
    ){
      return;
    }

    exporting = true;

    updateButtons();

    setMessage(
      "Exporting WebM... DO NOT CLOSE THIS TAB 🎬"
    );

    stopPlayback();

    /*
      Reset everything.
    */

    stopAllVideos();

    currentClipIndex = -1;

    currentTime = 0;

    audio.currentTime = 0;

    /*
      Canvas video stream.
    */

    const canvasStream =
      canvas.captureStream(60);

    /*
      Audio stream.
    */

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();
    }

    if(
      audioContext.state === "suspended"
    ){

      await audioContext.resume();
    }

    if(!audioGraphConnected){

      audioSource =
        audioContext.createMediaElementSource(
          audio
        );

      audioDestination =
        audioContext.createMediaStreamDestination();

      audioSource.connect(
        audioContext.destination
      );

      audioSource.connect(
        audioDestination
      );

      audioGraphConnected = true;
    }

    const combined =
      new MediaStream();

    for(const track of canvasStream.getVideoTracks()){

      combined.addTrack(track);
    }

    for(const track of audioDestination.getAudioTracks()){

      combined.addTrack(track);
    }

    let mimeType = "";

    const options = [
      "video/webm;codecs=vp9,opus",
      "video/webm;codecs=vp8,opus",
      "video/webm"
    ];

    for(const type of options){

      if(
        MediaRecorder.isTypeSupported(type)
      ){

        mimeType = type;
        break;
      }
    }

    if(!mimeType){

      setMessage(
        "Your browser doesn't support WebM recording."
      );

      exporting = false;
      updateButtons();

      return;
    }

    const recorder =
      new MediaRecorder(
        combined,
        {
          mimeType,
          videoBitsPerSecond:8_000_000,
          audioBitsPerSecond:192_000
        }
      );

    const chunks = [];

    recorder.ondataavailable = e=>{

      if(e.data && e.data.size){
        chunks.push(e.data);
      }
    };

    const finished =
      new Promise(resolve=>{

        recorder.onstop = resolve;

      });

    recorder.start(250);

    /*
      Start audio.
    */

    paused = false;
    playing = true;

    currentTime = 0;

    currentClipIndex = -1;

    playStartTime =
      performance.now();

    await audio.play();

    /*
      Dedicated export loop.

      Same timeline logic as preview,
      but export cannot depend on the browser
      animation loop's pause state.
    */

    await new Promise(resolve=>{

      let last = performance.now();

      function exportFrame(){

        if(!exporting){

          resolve();
          return;
        }

        const now =
          performance.now();

        /*
          Audio is the clock.
        */

        let time =
          audio.currentTime;

        /*
          If video is longer than audio,
          continue until final video end.
        */

        if(
          audio.ended &&
          totalDuration > audio.duration
        ){

          time =
            Math.min(
              totalDuration,
              audio.duration +
              (now - last) / 1000
            );
        }

        currentTime = time;

        const found =
          findClip(time);

        if(found){

          if(
            found.index !== currentClipIndex
          ){

            currentClipIndex =
              found.index;

            if(
              found.clip.type === "video"
            ){

              syncVideoToTimeline(
                found.clip.source,
                found.clip.sourceIndex,
                time
              );

            }else{

              /*
                FINAL VIDEO → PHOTO
                happens immediately here.
              */

              stopAllVideos();
            }
          }

          if(
            found.clip.type === "video"
          ){

            syncVideoToTimeline(
              found.clip.source,
              found.clip.sourceIndex,
              time
            );
          }
        }

        renderFrame(time);

        const pct =
          totalDuration > 0
            ? time / totalDuration
            : 0;

        progress.style.width =
          clamp(pct * 100,0,100) + "%";

        timeLabel.textContent =
          formatTime(time);

        if(time >= totalDuration){

          currentTime =
            totalDuration;

          renderFrame(totalDuration);

          resolve();

          return;
        }

        last = now;

        requestAnimationFrame(exportFrame);
      }

      requestAnimationFrame(exportFrame);
    });

    /*
      Stop audio and videos.
    */

    try{
      audio.pause();
    }catch(e){}

    stopAllVideos();

    /*
      Let the final frame enter the MediaRecorder.
    */

    await sleep(120);

    recorder.stop();

    await finished;

    const blob =
      new Blob(
        chunks,
        {
          type:mimeType
        }
      );

    const url =
      URL.createObjectURL(blob);

    const a =
      document.createElement("a");

    a.href = url;

    a.download =
      "john-banana-auto-edit.webm";

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(()=>{
      URL.revokeObjectURL(url);
    },5000);

    exporting = false;
    playing = false;
    paused = false;

    updateButtons();

    setMessage(
      "DONE. WebM exported successfully. 🍌🔥"
    );
  }
);


/* =========================================================
   INITIAL FRAME
========================================================= */

drawPlaceholder();

updateButtons();

</script>
